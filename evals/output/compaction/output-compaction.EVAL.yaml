name: evals-output-compaction-output-compaction
version: '1.0'
description: Output compaction cases scored with deterministic retention plus LLM semantic quality and execution bounds.
metadata:
  layered_evaluator_surface: true
assertions:
- name: output-quality
  type: llm-grader
  target: grader-openai
  weight: 2.0
  rubrics:
  - id: semantic-compression
    outcome: Response preserves all task-critical facts while remaining compact.
    weight: 2
    required: true
  - id: no-hallucination
    outcome: Response does not introduce unsupported facts.
    weight: 1
    required: true
- name: output-budget
  type: execution-metrics
  max_tokens: 6000
  max_duration_ms: 120000
  weight: 0.25
tests:
- id: ci-failure-triage
  input:
  - role: user
    content: Summarize a failed validation run with enough detail for the next fix.
  expected_output: "{\n  \"scenario\": \"ci-failure-triage\",\n  \"caveman_baseline\": \"CI red. `npm run typecheck` fails\
    \ in `packages/core/src/router/router.ts:87`: TS2345. Cause: `schemaId` may be undefined. Fix guard before `routeToSchema(schemaId)`.\
    \ Rerun `npm run typecheck`.\",\n  \"required_terms\": [\n    \"npm run typecheck\",\n    \"TS2345\",\n    \"packages/core/src/router/router.ts:87\"\
    ,\n    \"schemaId\",\n    \"routeToSchema(schemaId)\"\n  ],\n  \"exact_terms\": [],\n  \"ordered_terms\": [],\n  \"forbidden_terms\"\
    : [],\n  \"required_patterns\": [],\n  \"forbidden_patterns\": [],\n  \"max_token_ratio\": 1,\n  \"min_fact_score\": 1,\n\
    \  \"caveman_tokens\": 48\n}\n"
  assertions:
  - name: output-compaction-deterministic
    type: code-grader
    command:
    - node
    - --import
    - tsx
    - evaluators/output/compaction/gradeCompaction.ts
    weight: 3.0
- id: review-finding
  input:
  - role: user
    content: Compress a code-review finding without dropping file, line, risk, or fix.
  expected_output: "{\n  \"scenario\": \"review-finding\",\n  \"caveman_baseline\": \"`packages/model-proxy/src/proxy.ts:142`\
    \ retries POST after partial body forwarded. Risk: duplicate side effects. Fix: retry only idempotent methods or failures\
    \ before body forwarding.\",\n  \"required_terms\": [\n    \"packages/model-proxy/src/proxy.ts:142\",\n    \"POST\",\n\
    \    \"partial body\",\n    \"duplicate side effects\",\n    \"idempotent\"\n  ],\n  \"exact_terms\": [],\n  \"ordered_terms\"\
    : [],\n  \"forbidden_terms\": [],\n  \"required_patterns\": [],\n  \"forbidden_patterns\": [],\n  \"max_token_ratio\"\
    : 1,\n  \"min_fact_score\": 1,\n  \"caveman_tokens\": 46\n}\n"
  assertions:
  - name: output-compaction-deterministic
    type: code-grader
    command:
    - node
    - --import
    - tsx
    - evaluators/output/compaction/gradeCompaction.ts
    weight: 3.0
- id: artifact-recovery
  input:
  - role: user
    content: Preserve recovery handles while shrinking a tool-output mediation summary.
  expected_output: "{\n  \"scenario\": \"artifact-recovery\",\n  \"caveman_baseline\": \"Payload omitted from chat. Raw: `.utk/tools/git.status/observations/run-9/output.raw.txt`.\
    \ Compact: `.utk/tools/git.status/observations/run-9/output.compact.toon`. Schema `shell.git-status.v1`, confidence 0.97.\"\
    ,\n  \"required_terms\": [\n    \".utk/tools/git.status/observations/run-9/output.raw.txt\",\n    \".utk/tools/git.status/observations/run-9/output.compact.toon\"\
    ,\n    \"shell.git-status.v1\",\n    \"0.97\"\n  ],\n  \"exact_terms\": [],\n  \"ordered_terms\": [],\n  \"forbidden_terms\"\
