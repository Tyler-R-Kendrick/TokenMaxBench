    : [\n    {\n      \"kind\": \"jsonPath\",\n      \"path\": \"$.cache_status\",\n      \"expected\": \"hit\"\n    },\n\
    \    {\n      \"kind\": \"jsonPath\",\n      \"path\": \"$.compressed_ref\",\n      \"expected\": \"cmp-cache-77\"\n \
    \   }\n  ],\n  \"compresr_baseline_text\": \"Compresr cache hit for sha256 abc123 reuses compressed ref cmp-cache-77.\"\
    ,\n  \"compresr_baseline_tokens\": 18,\n  \"min_fact_score\": 1,\n  \"install_config\": {\n    \"pythonPackage\": \"compresr\"\
