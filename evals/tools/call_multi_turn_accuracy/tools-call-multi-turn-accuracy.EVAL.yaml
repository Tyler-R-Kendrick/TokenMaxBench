    content: Recover full compressed content through an expand-context reference.
  expected_output: "{\n  \"scenario\": \"expand-context-shadow-ref\",\n  \"tool_id\": \"compresr.expand.context\",\n  \"required_facts\"\
    : [\n    {\n      \"kind\": \"literal\",\n      \"value\": \"[REF:ctx_9ab3]\"\n    },\n    {\n      \"kind\": \"literal\"\
    ,\n      \"value\": \"raw-output-77\"\n    }\n  ],\n  \"compresr_baseline_text\": \"Compresr compressed block uses [REF:ctx_9ab3]\
    \ and expand_context to recover raw-output-77.\",\n  \"compresr_baseline_tokens\": 23,\n  \"min_fact_score\": 1,\n  \"\
    install_config\": {\n    \"pythonPackage\": \"compresr\",\n    \"installedVersion\": \"2.5.1\",\n    \"installCommand\"\
