name: evals-tools-call-multi-turn-accuracy-tools-call-multi-turn-accuracy
version: '1.0'
description: Multi-turn tool accuracy cases for retained tool/history context.
metadata:
  layered_evaluator_surface: true
assertions:
- name: tool-history-quality
  type: llm-grader
  target: grader-openai
  weight: 1.0
  rubrics:
  - id: context-retention
    outcome: Final answer preserves relevant prior-turn and prior-tool context.
    weight: 2
    required: true
  - id: resolution
    outcome: Final answer resolves the latest user request using the retained context.
    weight: 1
    required: true
- name: tool-history-budget
  type: execution-metrics
  max_tool_calls: 30
  max_tokens: 12000
  max_duration_ms: 240000
  weight: 0.25
tests:
- id: streaming-compression-chunks
  input:
  - role: user
    content: Compress streaming chunks while retaining done marker and final content.
  expected_output: "{\n  \"scenario\": \"streaming-compression-chunks\",\n  \"tool_id\": \"compresr.stream.chunks\",\n  \"\
    required_facts\": [\n    {\n      \"kind\": \"literal\",\n      \"value\": \"failed shard windows-node20\"\n    },\n \
    \   {\n      \"kind\": \"literal\",\n      \"value\": \"done=true\"\n    }\n  ],\n  \"compresr_baseline_text\": \"Compresr\
    \ stream emits compressed chunks, including failed shard windows-node20 and final done marker.\",\n  \"compresr_baseline_tokens\"\
    : 26,\n  \"min_fact_score\": 1,\n  \"install_config\": {\n    \"pythonPackage\": \"compresr\",\n    \"installedVersion\"\
    : \"2.5.1\",\n    \"installCommand\": \"python -m pip install --user compresr==2.5.1\",\n    \"apiKeyEnvVar\": \"COMPRESR_API_KEY\"\
    ,\n    \"liveApiMode\": \"disabled-without-api-key\",\n    \"baselineMode\": \"deterministic-installed-sdk-model-baselines\"\
    ,\n    \"models\": [\n      \"espresso_v1\",\n      \"latte_v1\",\n      \"agentic_history_lingua\",\n      \"agentic_tool_output_gemfilter\"\
    ,\n      \"agentic_tool_output_lingua\",\n      \"agentic_tool_discovery_sat\"\n    ],\n    \"endpoints\": [\n      \"\
    /api/compress/question-agnostic/\",\n      \"/api/compress/question-specific/\",\n      \"/api/compress/question-agnostic/batch\"\
    ,\n      \"/api/compress/question-specific/batch\"\n    ]\n  }\n}\n"
  assertions:
  - name: tool-multi-turn-deterministic
    type: code-grader
    command:
    - node
    - --import
    - tsx
    - evaluators/tools/call_multi_turn_accuracy/gradeToolMultiTurnAccuracy.ts
    weight: 2.0
- id: history-compaction-threshold
  input:
  - role: user
    content: Compact long history only near threshold while preserving reserve budget.
  expected_output: "{\n  \"scenario\": \"history-compaction-threshold\",\n  \"tool_id\": \"compresr.history.threshold\",\n\
    \  \"required_facts\": [\n    {\n      \"kind\": \"literal\",\n      \"value\": \"threshold=75%\"\n    },\n    {\n   \
    \   \"kind\": \"literal\",\n      \"value\": \"reserve_output_tokens=4096\"\n    }\n  ],\n  \"compresr_baseline_text\"\
    : \"Compresr history compaction triggers at 75 percent context, keeps 4096 output-token reserve, stores history summary\
    \ reference.\",\n  \"compresr_baseline_tokens\": 32,\n  \"min_fact_score\": 1,\n  \"install_config\": {\n    \"pythonPackage\"\
    : \"compresr\",\n    \"installedVersion\": \"2.5.1\",\n    \"installCommand\": \"python -m pip install --user compresr==2.5.1\"\
    ,\n    \"apiKeyEnvVar\": \"COMPRESR_API_KEY\",\n    \"liveApiMode\": \"disabled-without-api-key\",\n    \"baselineMode\"\
    : \"deterministic-installed-sdk-model-baselines\",\n    \"models\": [\n      \"espresso_v1\",\n      \"latte_v1\",\n \
    \     \"agentic_history_lingua\",\n      \"agentic_tool_output_gemfilter\",\n      \"agentic_tool_output_lingua\",\n \
    \     \"agentic_tool_discovery_sat\"\n    ],\n    \"endpoints\": [\n      \"/api/compress/question-agnostic/\",\n    \
    \  \"/api/compress/question-specific/\",\n      \"/api/compress/question-agnostic/batch\",\n      \"/api/compress/question-specific/batch\"\
    \n    ]\n  }\n}\n"
  assertions:
  - name: tool-multi-turn-deterministic
    type: code-grader
    command:
    - node
    - --import
    - tsx
    - evaluators/tools/call_multi_turn_accuracy/gradeToolMultiTurnAccuracy.ts
    weight: 2.0
