name: evals-tools-call-completion-rtk-tool-call-completion
version: '1.0'
description: RTK-style tool output cases for call completion fidelity.
metadata:
  layered_evaluator_surface: true
assertions:
- name: rtk-tool-budget
  type: execution-metrics
  max_tool_calls: 20
  max_tokens: 8000
  max_duration_ms: 180000
  weight: 0.25
tests:
- id: shell-git-status
  input:
  - role: user
    content: Summarize dirty worktree state without losing modified and untracked files.
  expected_output: "{\n  \"scenario\": \"shell-git-status\",\n  \"tool_id\": \"shell.git.status\",\n  \"required_facts\":\
    \ [\n    {\n      \"kind\": \"literal\",\n      \"value\": \"M README.md\"\n    },\n    {\n      \"kind\": \"literal\"\
    ,\n      \"value\": \"rtkParityFixtures.ts\"\n    }\n  ],\n  \"rtk_supported\": true,\n  \"rtk_baseline_bytes\": 81,\n\
    \  \"rtk_baseline_tokens\": 21,\n  \"rtk_notes\": null\n}\n"
  assertions:
  - name: rtk-tool-call-completion-deterministic
    type: code-grader
    command:
    - node
    - --import
    - tsx
    - evaluators/tools/call_completion/gradeToolCallCompletion.ts
    weight: 2.0
- id: shell-git-diff
  input:
  - role: user
