name: evals-tools-call-completion-tools-call-completion
version: '1.0'
description: Tool call completion cases for preserving needed tool-output facts.
metadata:
  layered_evaluator_surface: true
assertions:
- name: tool-call-quality
  type: llm-grader
  target: grader-openai
  weight: 1.0
  rubrics:
  - id: call-relevance
    outcome: Answer keeps the tool result facts needed to complete the user request.
    weight: 2
    required: true
  - id: compactness
    outcome: Answer omits irrelevant tool noise.
    weight: 1
- name: tool-call-budget
  type: execution-metrics
  max_tool_calls: 20
  max_tokens: 8000
  max_duration_ms: 180000
  weight: 0.25
tests:
- id: tool-output-large-json-gemfilter
  input:
  - role: user
    content: Compress large JSON tool output while retaining route and failed event.
  expected_output: "{\n  \"scenario\": \"tool-output-large-json-gemfilter\",\n  \"tool_id\": \"compresr.tool.large-json\"\
    ,\n  \"required_facts\": [\n    {\n      \"kind\": \"jsonPath\",\n      \"path\": \"$.route\",\n      \"expected\": \"\
    tool-output\"\n    },\n    {\n      \"kind\": \"jsonPath\",\n      \"path\": \"$.events[23].status\",\n      \"expected\"\
    : \"failed\"\n    }\n  ],\n  \"compresr_baseline_text\": \"Compresr gemfilter keeps query-relevant failed event, route=tool-output,\
    \ event evt-23 failed, shadow ref for full JSON.\",\n  \"compresr_baseline_tokens\": 30,\n  \"min_fact_score\": 1,\n \
    \ \"install_config\": {\n    \"pythonPackage\": \"compresr\",\n    \"installedVersion\": \"2.5.1\",\n    \"installCommand\"\
    : \"python -m pip install --user compresr==2.5.1\",\n    \"apiKeyEnvVar\": \"COMPRESR_API_KEY\",\n    \"liveApiMode\"\
    : \"disabled-without-api-key\",\n    \"baselineMode\": \"deterministic-installed-sdk-model-baselines\",\n    \"models\"\
    : [\n      \"espresso_v1\",\n      \"latte_v1\",\n      \"agentic_history_lingua\",\n      \"agentic_tool_output_gemfilter\"\
    ,\n      \"agentic_tool_output_lingua\",\n      \"agentic_tool_discovery_sat\"\n    ],\n    \"endpoints\": [\n      \"\
    /api/compress/question-agnostic/\",\n      \"/api/compress/question-specific/\",\n      \"/api/compress/question-agnostic/batch\"\
    ,\n      \"/api/compress/question-specific/batch\"\n    ]\n  }\n}\n"
  assertions:
  - name: tool-call-completion-deterministic
    type: code-grader
    command:
    - node
    - --import
    - tsx
    - evaluators/tools/call_completion/gradeToolCallCompletion.ts
    weight: 2.0
