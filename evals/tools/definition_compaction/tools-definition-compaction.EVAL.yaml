- id: tool-output-refusal-threshold
  input:
  - role: user
    content: Reject compression when savings do not clear refusal threshold.
  expected_output: "{\n  \"scenario\": \"tool-output-refusal-threshold\",\n  \"tool_id\": \"compresr.refusal.threshold\",\n\
    \  \"required_facts\": [\n    {\n      \"kind\": \"jsonPath\",\n      \"path\": \"$.savings\",\n      \"expected\": 0.07\n\
    \    },\n    {\n      \"kind\": \"jsonPath\",\n      \"path\": \"$.accepted\",\n      \"expected\": false\n    }\n  ],\n\
    \  \"compresr_baseline_text\": \"Compresr rejects compression when original 1000 tokens to compressed 930 tokens saves\
    \ only 0.07, below refusal threshold 0.15, and records accepted=false mapping metadata.\",\n  \"compresr_baseline_tokens\"\
    : 43,\n  \"min_fact_score\": 1,\n  \"install_config\": {\n    \"pythonPackage\": \"compresr\",\n    \"installedVersion\"\
    : \"2.5.1\",\n    \"installCommand\": \"python -m pip install --user compresr==2.5.1\",\n    \"apiKeyEnvVar\": \"COMPRESR_API_KEY\"\
