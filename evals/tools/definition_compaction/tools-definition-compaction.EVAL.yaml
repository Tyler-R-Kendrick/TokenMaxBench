name: evals-tools-definition-compaction-tools-definition-compaction
version: '1.0'
description: Tool definition compaction cases for schema/tool metadata fidelity.
metadata:
  layered_evaluator_surface: true
assertions:
- name: tool-definition-quality
  type: llm-grader
  target: grader-openai
  weight: 1.0
  rubrics:
  - id: schema-fidelity
    outcome: Response preserves required tool/schema names, required arguments, and constraints.
    weight: 3
    required: true
  - id: definition-compactness
    outcome: Response removes redundant schema prose without dropping operational constraints.
    weight: 1
tests:
- id: tool-discovery-required-tool
  input:
  - role: user
    content: Filter large tool catalog while keeping required PR review tool.
  expected_output: "{\n  \"scenario\": \"tool-discovery-required-tool\",\n  \"tool_id\": \"compresr.tool.discovery\",\n  \"\
    required_facts\": [\n    {\n      \"kind\": \"jsonPath\",\n      \"path\": \"$.tools[7].name\",\n      \"expected\": \"\
    github.pull_request.review_comments\"\n    },\n    {\n      \"kind\": \"jsonPath\",\n      \"path\": \"$.selected[0]\"\
    ,\n      \"expected\": \"github.pull_request.review_comments\"\n    }\n  ],\n  \"compresr_baseline_text\": \"Compresr\
    \ tool discovery keeps github.pull_request.review_comments and defers unrelated tool schemas behind search.\",\n  \"compresr_baseline_tokens\"\
    : 29,\n  \"min_fact_score\": 1,\n  \"install_config\": {\n    \"pythonPackage\": \"compresr\",\n    \"installedVersion\"\
    : \"2.5.1\",\n    \"installCommand\": \"python -m pip install --user compresr==2.5.1\",\n    \"apiKeyEnvVar\": \"COMPRESR_API_KEY\"\
    ,\n    \"liveApiMode\": \"disabled-without-api-key\",\n    \"baselineMode\": \"deterministic-installed-sdk-model-baselines\"\
    ,\n    \"models\": [\n      \"espresso_v1\",\n      \"latte_v1\",\n      \"agentic_history_lingua\",\n      \"agentic_tool_output_gemfilter\"\
    ,\n      \"agentic_tool_output_lingua\",\n      \"agentic_tool_discovery_sat\"\n    ],\n    \"endpoints\": [\n      \"\
    /api/compress/question-agnostic/\",\n      \"/api/compress/question-specific/\",\n      \"/api/compress/question-agnostic/batch\"\
    ,\n      \"/api/compress/question-specific/batch\"\n    ]\n  }\n}\n"
  assertions:
  - name: tool-definition-compaction-deterministic
    type: code-grader
    command:
    - node
    - --import
    - tsx
    - evaluators/tools/definition_compaction/gradeToolDefinitionCompaction.ts
    weight: 2.0
- id: tool-schema-compression-required-params
  input:
  - role: user
    content: Compress verbose tool schema while preserving required params.
  expected_output: "{\n  \"scenario\": \"tool-schema-compression-required-params\",\n  \"tool_id\": \"compresr.tool.schema\"\
    ,\n  \"required_facts\": [\n    {\n      \"kind\": \"jsonPath\",\n      \"path\": \"$.input_schema.required[2]\",\n  \
    \    \"expected\": \"pull_number\"\n    },\n    {\n      \"kind\": \"jsonPath\",\n      \"path\": \"$.name\",\n      \"\
    expected\": \"github.pull_request.review_comments\"\n    }\n  ],\n  \"compresr_baseline_text\": \"Compresr schema compression\
    \ keeps tool name and required owner, repo, pull_number parameters.\",\n  \"compresr_baseline_tokens\": 24,\n  \"min_fact_score\"\
    : 1,\n  \"install_config\": {\n    \"pythonPackage\": \"compresr\",\n    \"installedVersion\": \"2.5.1\",\n    \"installCommand\"\
    : \"python -m pip install --user compresr==2.5.1\",\n    \"apiKeyEnvVar\": \"COMPRESR_API_KEY\",\n    \"liveApiMode\"\
    : \"disabled-without-api-key\",\n    \"baselineMode\": \"deterministic-installed-sdk-model-baselines\",\n    \"models\"\
    : [\n      \"espresso_v1\",\n      \"latte_v1\",\n      \"agentic_history_lingua\",\n      \"agentic_tool_output_gemfilter\"\
    ,\n      \"agentic_tool_output_lingua\",\n      \"agentic_tool_discovery_sat\"\n    ],\n    \"endpoints\": [\n      \"\
    /api/compress/question-agnostic/\",\n      \"/api/compress/question-specific/\",\n      \"/api/compress/question-agnostic/batch\"\
    ,\n      \"/api/compress/question-specific/batch\"\n    ]\n  }\n}\n"
  assertions:
  - name: tool-definition-compaction-deterministic
    type: code-grader
    command:
    - node
    - --import
    - tsx
    - evaluators/tools/definition_compaction/gradeToolDefinitionCompaction.ts
    weight: 2.0
